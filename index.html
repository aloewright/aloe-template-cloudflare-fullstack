<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,300..900;1,300..900&display=swap"
    />
    <title>Cloudflare SaaS Template</title>
    <meta name="description" content="Reference SaaS on Cloudflare Workers: React + Mantine, Hono, D1, Polar billing." />
    <!-- Apply the color scheme before React mounts to avoid a flash of the wrong
         theme: use the saved preference if set, otherwise follow the OS setting
         (matches Mantine's defaultColorScheme="auto" + localStorage manager). -->
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("mantine-color-scheme-value");
          const scheme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-mantine-color-scheme", scheme);
        } catch {
          /* ignore: fall back to Mantine's default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
