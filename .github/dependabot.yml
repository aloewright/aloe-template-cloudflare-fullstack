version: 2
updates:
  # Root: the app + worker + tooling
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    labels: [dependencies, app]
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  # Docs site (Vite + Mantine + MDX)
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    labels: [dependencies, docs]
    commit-message:
      prefix: "chore(deps-docs)"
      include: scope
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  # CI workflows (actions/* and cloudflare/wrangler-action)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 3
    labels: [dependencies, ci]
    commit-message:
      prefix: "chore(ci)"
      include: scope
    groups:
      actions:
        applies-to: version-updates
        update-types: [minor, patch]
